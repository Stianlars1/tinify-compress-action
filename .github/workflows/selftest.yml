# Runs the action against its own fixtures with a real (test) API key.
# Requires the TINIFY_TEST_KEY repository secret; skipped when it is absent
# (e.g. on forks).
name: Selftest

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    if: ${{ vars.SELFTEST_DISABLED != 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for API key
        id: key
        env:
          TINIFY_TEST_KEY: ${{ secrets.TINIFY_TEST_KEY }}
        run: |
          if [ -n "$TINIFY_TEST_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "TINIFY_TEST_KEY secret not set; skipping selftest." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run the action on the fixtures (check mode)
        if: steps.key.outputs.present == 'true'
        id: tinify
        uses: ./
        with:
          api_key: ${{ secrets.TINIFY_TEST_KEY }}
          patterns: "fixtures/*.{png,jpg}"
          mode: check
      - name: Assert both fixtures were processed
        if: steps.key.outputs.present == 'true'
        env:
          FILES_PROCESSED: ${{ steps.tinify.outputs.files_processed }}
          SUMMARY_JSON: ${{ steps.tinify.outputs.summary_json }}
        run: |
          echo "files_processed=$FILES_PROCESSED"
          echo "$SUMMARY_JSON"
          if [ "$FILES_PROCESSED" != "2" ]; then
            echo "expected 2 fixtures to be processed" >&2
            exit 1
          fi
